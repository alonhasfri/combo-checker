name: Build Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: combo-desktop
        run: npm install
      - name: Build portable .exe
        working-directory: combo-desktop
        run: npx electron-builder --win portable --publish never
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp combo-desktop/dist/combo-checker-windows.exe combo-checker-windows.exe
          gh release create "win-${{ github.run_number }}" combo-checker-windows.exe --title "Combo Checker Windows ${{ github.run_number }}" --notes "Run this .exe on Windows (no install needed)."
