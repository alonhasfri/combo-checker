name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q combo-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Restore signing key (if configured)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > combo-android/app/combo.keystore
            echo "Signing key restored."
          else
            echo "No SIGNING_KEYSTORE_B64 secret set; building with debug signing (not updatable in place)."
          fi
      - name: Build
        working-directory: combo-android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: build-${{ github.run_number }}
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp combo-android/app/build/outputs/apk/debug/app-debug.apk combo-checker.apk
          gh release create "build-${{ github.run_number }}" combo-checker.apk --title "Combo Checker build ${{ github.run_number }}" --notes "Install this APK on your phone"
