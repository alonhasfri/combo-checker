name: Build Voice Bubble APK
on:
  workflow_dispatch:
  push:
    paths:
      - "voice-bubble/**"
      - ".github/workflows/build-voice-bubble.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - name: Download sherpa-onnx (Live engine)
        run: |
          mkdir -p voice-bubble/app/libs
          curl -fsSL --retry 4 -o voice-bubble/app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
          ls -l voice-bubble/app/libs
      - name: Make the fast Turbo model (only once; kept in the voice-bubble-models release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view voice-bubble-models --json assets -q '.assets[].name' 2>/dev/null | grep -qx ggml-distil-small.en-q8_0.bin; then
            echo "Already made."; exit 0
          fi
          git clone -q --depth 1 -b v1.7.6 https://github.com/ggml-org/whisper.cpp /tmp/wcpp
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF > /dev/null
          cmake --build /tmp/wcpp/build --target quantize -j 4 > /dev/null || cmake --build /tmp/wcpp/build --target whisper-quantize -j 4 > /dev/null
          Q=$(ls /tmp/wcpp/build/bin/ | grep quantize | head -1)
          curl -fsSL --retry 4 -o /tmp/distil.bin https://huggingface.co/distil-whisper/distil-small.en/resolve/main/ggml-distil-small.en.bin
          "/tmp/wcpp/build/bin/$Q" /tmp/distil.bin /tmp/ggml-distil-small.en-q8_0.bin q8_0
          ls -l /tmp/ggml-distil-small.en-q8_0.bin
          gh release view voice-bubble-models >/dev/null 2>&1 || gh release create voice-bubble-models \
            --title "Voice Bubble speech models" --notes "Speech models made for Voice Bubble; the app downloads them." \
            --prerelease --latest=false
          gh release upload voice-bubble-models /tmp/ggml-distil-small.en-q8_0.bin --clobber
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Restore signing key (if configured)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > voice-bubble/app/voice.keystore
            echo "Signing key restored."
          else
            echo "No SIGNING_KEYSTORE_B64 secret set; building with debug signing."
          fi
      - name: Build
        working-directory: voice-bubble
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: voice-${{ github.run_number }}
        run: gradle testBasicDebugUnitTest assembleBasicDebug assembleAutotypeDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp voice-bubble/app/build/outputs/apk/basic/debug/app-basic-debug.apk voice-bubble.apk
          cp voice-bubble/app/build/outputs/apk/autotype/debug/app-autotype-debug.apk voice-bubble-autotype.apk
          # Never marked "latest": that release is what Comboed's update check points to.
          gh release create "voice-bubble-${{ github.run_number }}" voice-bubble.apk voice-bubble-autotype.apk \
            --target "${{ github.sha }}" \
            --title "Voice Bubble build ${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Voice Bubble: floating microphone, on-device speech to text. On your phone, tap voice-bubble.apk to install (copies the text for you to paste). voice-bubble-autotype.apk also types the text in for you, but Play Protect blocks installing it from a browser." \
            --prerelease --latest=false
          # One permanent link that always has the newest build: the "voice-bubble-latest" release
          # (created once, then its files are replaced every build). Also never marked "latest".
          if ! gh release view voice-bubble-latest >/dev/null 2>&1; then
            gh release create voice-bubble-latest --title "Voice Bubble (always the newest version)" \
              --notes "Always the newest Voice Bubble. voice-bubble-autotype.apk types for you (recommended); voice-bubble.apk copies the text instead." \
              --prerelease --latest=false
          fi
          gh release upload voice-bubble-latest voice-bubble.apk voice-bubble-autotype.apk --clobber
          gh release edit voice-bubble-latest --title "Voice Bubble (always the newest: build ${{ github.run_number }})"
